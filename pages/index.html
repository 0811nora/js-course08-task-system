<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.20/c3.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/css/iziToast.min.css">
    <title>WR 後台系統</title>
  </head>
  <body>

    <div class="system-main">

      <!-- header -->
      <section class="container">
        <%- include('./layout/header'); -%>
      </section>

      <div class="header-box"></div>

      <!-- 圖表 -->
      <section class="container py-12">
        <h2 class="text-center mb-10 fw-medium">全產品類別營收比重</h2>
        <div id="chart" class="chartArea">
          
        </div>
      </section>

      <!-- 訂單資訊 -->
      <section class="container py-12">

        <div class="text-end mb-4">
          <button class="btn btn-primary deleteAllBtn">刪除所有商品</button>
        </div>

        <table class="table">
          <thead>
            <tr class="">
              <th scope="col">訂單編號</th>
              <th scope="col">聯絡人</th>
              <th scope="col">聯絡地址</th>
              <th scope="col">電子郵件</th>
              <th scope="col">訂單品項</th>
              <th scope="col" class="text-center">訂單日期</th>
              <th scope="col" class="text-center">訂單狀態</th>
              <th scope="col" class="text-center">操作</th>
            </tr>
          </thead>
          <tbody class="orderList"></tbody>
        </table>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.20/c3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/js/iziToast.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script type="module" src="../main.js"></script>
  </body>
</html>
